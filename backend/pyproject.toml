[project]
name = "backend"
version = "0.1.0"
description = "Backend para interpretar peticiones de late checkout con IA"
authors = [
    { name = "Aithor", email = "aithorjose07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Los tests marcados como "integration" llaman a los servicios reales:
# necesitan red y el .env con claves, y mutan su estado remoto. Por eso no
# se ejecutan por defecto. Para lanzarlos:  pytest -m integration
markers = [
    "integration: llama a los servicios reales (necesita red y claves del .env)",
]
addopts = "-m 'not integration'"
